id: seattle
name: Seattle
timezone: America/Los_Angeles
update_schedule: 0 4/8 * * *
areas:
  - name: The Exits
    drive: 45 min
    crags:
      # I-90 conglomerate — sedimentary, slow to dry, and several walls seep.
      - name: Deception Crags
        lat: 47.4408
        lon: -121.5860
        rock: conglomerate
        aspect: shade
        seepage: true
      - name: Mt Washington
        lat: 47.4280
        lon: -121.5930
        rock: conglomerate
        aspect: PM sun
        seepage: false
      - name: Far Side
        lat: 47.4395
        lon: -121.5810
        rock: conglomerate
        aspect: shade
        seepage: false

  - name: Index
    drive: 1 hr
    crags:
      # Granite on the south side of the valley — dries faster than the Exits,
      # but the Lower Town Wall is a notorious seeper after wet spells.
      - name: Lower Town Wall
        lat: 47.8206
        lon: -121.5731
        rock: granite
        aspect: PM sun
        seepage: true
      - name: Upper Town Wall
        lat: 47.8230
        lon: -121.5720
        rock: granite
        aspect: sun all day
        seepage: false
      - name: Inner Walls
        lat: 47.8190
        lon: -121.5745
        rock: granite
        aspect: shade
        seepage: false

  - name: Tieton River
    drive: 2 hr 45
    crags:
      # East-side basalt columns — desert-dry and sunny, the escape when the
      # west side is socked in. Can be too hot mid-summer afternoons.
      - name: Royal Columns
        lat: 46.7016
        lon: -120.9300
        rock: basalt
        aspect: sun all day
        seepage: false
      - name: The Bend
        lat: 46.6950
        lon: -120.9480
        rock: basalt
        aspect: mixed
        seepage: false
      - name: The Cave
        lat: 46.6985
        lon: -120.9400
        rock: basalt
        aspect: shade
        seepage: false
